# Render Blueprint — deploy backend (server/) và web (web/) lên Render, gói free.
# Tạo service: mở https://render.com/deploy?repo=https://github.com/tramnancy0687-creator/Phong-kham-Nam-yeu
services:
  - type: web
    name: phong-kham-nam-yeu-api
    runtime: node
    plan: free
    region: singapore # gần DB Neon (aws-ap-southeast-1)
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_POOL_MAX
        value: "5"
      - key: DATABASE_URL # chuỗi kết nối Neon — nhập tay khi tạo (lấy trong server/.env.production)
        sync: false
      - key: JWT_SECRET # Render tự sinh chuỗi ngẫu nhiên
        generateValue: true

  - type: web
    name: phong-kham-nam-yeu-web
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT # Render cấp cổng qua biến PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # next.config.mjs đọc biến này lúc build để chuyển /api/* sang backend
      - key: API_URL
        value: https://phong-kham-nam-yeu-api.onrender.com
